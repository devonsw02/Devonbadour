<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://use.typekit.net/wnd0efk.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume — Devon Ba Dour</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: #000000;
            color: #F9F6EE;
            font-family: Degular, Arial, sans-serif;
            font-size: 14px;
        }

        :root {
            --page-padding: 2rem;
            --small-text: 11px;
        }

        .site-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem var(--page-padding);
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            column-gap: 2rem;
            align-items: start;
            z-index: 1000;
            mix-blend-mode: normal;
        }

        .nav-name,
        .nav-link {
            color: #ffffff;
            text-decoration: none;
            line-height: 1;
            transition: opacity 0.25s ease;
        }

        .nav-name {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .nav-link {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: -0.01em;
        }

        .nav-name:hover,
        .nav-link:hover {
            opacity: 0.5;
        }

        .nav-toggle {
            display: none;
        }

        .resume-page {
            width: 100%;
            padding: 10rem var(--page-padding) 10rem var(--page-padding);
        }

        .resume-image {
            display: block;
            width: 75%;
            height: auto;
            margin: 0 auto;
            object-fit: contain;
        }

        .site-footer {
            padding: 0 var(--page-padding) 2rem var(--page-padding);
        }

        .footer-line {
            width: 100%;
            height: 1px;
            background: rgba(249, 246, 238, 0.35);
            margin-bottom: 1.5rem;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 2rem;
            align-items: start;
        }

        .footer-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1;
        }

        .footer-link {
            color: #F9F6EE;
            font-size: 14px;
            font-weight: 400;
            line-height: 1;
            text-decoration: none;
            transition: opacity 0.25s ease;
        }

        .footer-link:hover {
            opacity: 0.5;
        }

        .footer-bottom {
            margin-top: 5rem;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            line-height: 1;
            opacity: 0.55;
        }


        @media (max-width: 700px) {

            :root {
                --page-padding: 1rem;
            }

            .site-nav {
                position: relative;
                top: auto;
                left: auto;
                width: 100%;
                padding: 1rem;
                display: grid;
                grid-template-columns: 1fr auto;
                column-gap: 1rem;
                row-gap: 1.25rem;
                align-items: center;
            }

            .nav-name {
                grid-column: 1;
                font-size: 13px;
            }

            .nav-toggle {
                display: flex;
                flex-direction: column;
                gap: 5px;
                background: none;
                border: none;
                padding: 0;
                cursor: pointer;
                justify-self: end;
            }

            .nav-toggle span {
                width: 24px;
                height: 2px;
                background-color: #ffffff;
                transition: transform 0.3s ease, opacity 0.3s ease;
            }

            .nav-link.nav-item {
                display: none;
                grid-column: 1 / -1;
                text-align: left;
                font-size: 13px;
                padding: 0.25rem 0;
            }

            .site-nav.active .nav-link.nav-item {
                display: block;
            }

            .site-nav.active .nav-toggle span:nth-child(1) {
                transform: translateY(7px) rotate(45deg);
            }
            .site-nav.active .nav-toggle span:nth-child(2) {
                opacity: 0;
            }
            .site-nav.active .nav-toggle span:nth-child(3) {
                transform: translateY(-7px) rotate(-45deg);
            }

            /* -----------------------------------------
               RESUME
            ----------------------------------------- */
            .resume-page {
                padding: 7rem 1rem 6rem 1rem;
            }

            .resume-image {
                width: 100%;
                height: auto;
            }

            /* -----------------------------------------
               FOOTER
            ----------------------------------------- */
            .site-footer {
                padding: 0 1rem 1rem 1rem;
            }

            .footer-grid {
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }

            .footer-name {
                grid-column: span 2;
            }

            .footer-link {
                font-size: 12px;
            }

            .footer-bottom {
                margin-top: 4rem;
                display: block;
                line-height: 1.5;
            }
        }

        @media (max-width: 390px) {

            :root {
                --page-padding: 0.85rem;
            }

            .site-nav {
                padding: 0.85rem;
            }

            .nav-name {
                font-size: 12px;
            }

            .nav-link {
                font-size: 10px;
            }
        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

    </style>

</head>

<body>

<nav class="site-nav">

    <a href="index.html" class="nav-name">
        DEVON BA DOUR
    </a>

    <button class="nav-toggle" aria-label="Toggle Menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <a href="index.html" class="nav-link nav-item">
        WORK
    </a>

    <a href="resume.html" class="nav-link nav-item">
        RESUME
    </a>

    <a href="reach-out.html" class="nav-link nav-item">
        REACH OUT!
    </a>

</nav>

<main class="resume-page">

    <img
            class="resume-image"
            src="images/Resume_white.jpg"
            alt="Devon Ba Dour Resume"
    >

</main>

<footer class="site-footer">

    <div class="footer-line"></div>

    <div class="footer-grid">

        <div class="footer-name">
            DEVON BA DOUR
        </div>

        <a href="resume.html" class="footer-link">
            RESUME
        </a>

        <a href="reach-out.html" class="footer-link">
            REACH OUT!
        </a>

    </div>

    <div class="footer-bottom">

        <span>
        </span>

        <span>
        </span>

    </div>

</footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const siteNav = document.querySelector('.site-nav');
        const navToggle = document.querySelector('.nav-toggle');

        navToggle.addEventListener('click', () => {
            siteNav.classList.toggle('active');
        });
    });
</script>

</body>

</html>
